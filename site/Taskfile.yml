version: '3'

vars:
  BIN: lith-site

tasks:
  generate:
    desc: Compile the templ views
    cmds:
      - go tool templ generate

  history:
    desc: Write each page's last commit (date, hash, subject) from git log to internal/githistory/data/history.json, which the binary embeds
    deps: [generate]
    cmds:
      - go run ./cmd/githistory

  docs:
    desc: Write the docs' generated parts, the package reference and the charts of lith's benchmarks (TestUpToDate fails until they are current)
    cmds:
      - go generate ./content

  dev:
    desc: Serve on http://127.0.0.1:8097 (metrics on :8197) and rebuild on every change (air)
    deps: [history]
    cmds:
      - go tool air

  run:
    desc: Serve once, in development mode, without rebuilding
    deps: [history]
    cmds:
      - go run ./cmd/lith-site -dev -log text

  test:
    desc: Vet, check the formatting, run the tests with the race detector (Chromium tests need LITH_CHROME_NO_SANDBOX=1 where there is no sandbox)
    deps: [history]
    cmds:
      - go vet ./...
      # Go 1.27's own gofmt: lith uses generic methods, which an older one rejects.
      - test -z "$($(go env GOROOT)/bin/gofmt -l .)" || { $(go env GOROOT)/bin/gofmt -l .; exit 1; }
      - go test -race ./...

  shots:
    desc: Screenshots of the pages and of their transitions, in ./tmp/shots
    cmds:
      - mkdir -p tmp/shots
      - LITH_SITE_SHOTS=$PWD/tmp/shots go test ./internal/app -run 'TestShots|TestTransitionShots' -count=1

  build:
    desc: Build the static binary, everything embedded
    deps: [history]
    vars:
      VERSION:
        sh: git describe --tags --match 'v[0-9]*' --always --dirty 2>/dev/null || echo dev
    env:
      CGO_ENABLED: '0'
    cmds:
      - go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o {{.BIN}} ./cmd/lith-site

  fonts:
    desc: Subset the fonts in fonts/ to the characters of fonts/unicodes.txt, as woff2 in internal/web/static/fonts (fonttools on Python 3.12, pinned, through uvx)
    vars:
      SUBSET: SOURCE_DATE_EPOCH=0 uvx --quiet --python 3.12 --from 'fonttools==4.60.1' --with 'brotli==1.1.0' pyftsubset --unicodes-file=fonts/unicodes.txt --flavor=woff2 --no-hinting --name-IDs=0,1,2,3,4,5,6,13,14
    cmds:
      # Code turns ligatures off (base.css), so JetBrains Mono keeps none: its calt is two thirds of the file.
      - "{{.SUBSET}} --layout-features=ccmp,locl,mark,mkmk,kern fonts/jetbrains-mono.ttf --output-file=internal/web/static/fonts/jetbrains-mono.woff2"
      - "{{.SUBSET}} fonts/pixelify-sans.ttf --output-file=internal/web/static/fonts/pixelify-sans.woff2"

  vendor-starbase:
    desc: Copy the Starbase components of internal/web/static/vendor/starbase/pins.json from its pinned snapshot, checking their integrity
    cmds:
      - go run ./cmd/vendor-starbase
