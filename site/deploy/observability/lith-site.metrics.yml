# lith-site's metrics listener for the host's Prometheus, installed as
# /etc/prometheus/apps/lith-site.yml, which the host's `apps` job reads.
#
# What it serves (lith-site's internal/app, Namespace "lith_site"):
#   lith_site_http_requests_total{route,code}         requests by ServeMux pattern and status
#   lith_site_http_request_duration_seconds{route}    latency, event streams left out
#   lith_site_http_requests_in_flight                 open requests, streams included
#   lith_site_writer_*                                batches, commands, failures, queue, commit p99 (lith/prom)
#   lith_site_live_*                                  ticks, overruns, renders, frames sent and dropped, streams (lith/prom)
#   lith_site_sse_budget_*                            limit, reserved, streams by setting, refused (lith/prom)
#   lith_site_db_query_duration_seconds{op}           statement timings (lith/dbmetrics/prom)
#   lith_site_db_slow_queries_total{op}
#   lith_site_build_info{version}
#   go_*, process_*                                   the Go runtime and the process
- targets: ['127.0.0.1:8197']
  labels: { app: lith-site, slot: prod }
