# Blackbox probes for lith-site, installed as /etc/prometheus/targets/lith-site.yml.
# `module` picks the blackbox module: http_2xx_lith, from blackbox-module.yml.
# `service` is the access log's site (lith), so the Services dashboard pairs them.
- targets: ['https://lith.zweiundeins.gmbh/']
  labels: { service: lith, module: http_2xx_lith }
- targets: ['https://lith.zweiundeins.gmbh/docs']
  labels: { service: lith, module: http_2xx_lith }
