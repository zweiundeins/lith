# Blackbox probes for lith-site, installed as /etc/prometheus/targets/lith-site.yml.
# `module` picks the blackbox module: http_2xx_lith needs the entry in
# blackbox-module.yml added to ../observability/blackbox/blackbox.yml.
- targets: ['https://lith.zweiundeins.gmbh/']
  labels: { service: lith-site, module: http_2xx_lith }
- targets: ['https://lith.zweiundeins.gmbh/docs']
  labels: { service: lith-site, module: http_2xx_lith }
