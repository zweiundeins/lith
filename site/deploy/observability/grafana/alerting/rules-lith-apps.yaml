# Alert rules for the apps on lith (github.com/zweiundeins/lith), from the
# metrics of their second listener (the go_runtime job). A site that stops
# answering trips the host's rule on every blackbox probe, so none here.
# Install as /etc/grafana/provisioning/alerting/rules-lith-apps.yaml.
#
# NOTE ON PROVENANCE: hand-authored to the schema of the host's exported
# rule files, without a running instance. Before trusting them, import them,
# confirm they evaluate without Error or false NoData states against real
# data, and export them over this file (see the host's observability README).
# The thresholds are starting points.
#
# The rules match any lith app by its metric names
# ({__name__=~".+_writer_..."}) and group by its app label, so a new lith app
# needs no new rule. Rates of counters that do not exist yet (no failure since
# the start) return nothing: noDataState OK.
apiVersion: 1
groups:
    - orgId: 1
      name: lith-apps
      folder: "Libretto Alerts"
      interval: 1m
      rules:
        - uid: lith-apps-5xx-ratio
          title: 'lith app: 5xx ratio above 2%'
          # Counts only with at least 5 errors in 5 minutes, so a quiet site
          # and a few streams cut by a restart do not page.
          condition: C
          data:
            - refId: A
              queryType: range
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus-ds
              model:
                expr: '(sum by (app) (rate({__name__=~".+_http_requests_total", job="go_runtime", code=~"5.."}[5m])) / sum by (app) (rate({__name__=~".+_http_requests_total", job="go_runtime"}[5m])) * (sum by (app) (increase({__name__=~".+_http_requests_total", job="go_runtime", code=~"5.."}[5m])) >= bool 5)) * on (app) (count by (app) ({__name__=~".+_writer_commands_total", job="go_runtime"}) > bool 0)'
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                type: reduce
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0.02
                        type: gt
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Alerting
          for: 5m
          annotations:
            summary: '{{ $labels.app }} answers more than 2% of its requests with a 5xx'
          isPaused: false
        - uid: lith-apps-tick-overruns
          title: 'lith app: ticks overrun'
          # Renders that take longer than Options.Tick (50 ms) make frames late
          # for everyone. The app logs the ticks' percentiles.
          condition: C
          data:
            - refId: A
              queryType: range
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus-ds
              model:
                expr: 'sum by (app) (rate({__name__=~".+_live_tick_overruns_total", job="go_runtime"}[5m]))'
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                type: reduce
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0.1
                        type: gt
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Alerting
          for: 10m
          annotations:
            summary: '{{ $labels.app }} has had more than one tick in ten take longer than the tick, for 10 minutes'
          isPaused: false
        - uid: lith-apps-frames-dropped
          title: 'lith app: frames dropped'
          # A stream keeps only each view's newest frame, so a slow client skips
          # some. Many means the streams cannot keep up (CPU, network, budget).
          condition: C
          data:
            - refId: A
              queryType: range
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus-ds
              model:
                expr: 'sum by (app) (rate({__name__=~".+_live_frames_dropped_total", job="go_runtime"}[5m])) / (sum by (app) (rate({__name__=~".+_live_frames_sent_total", job="go_runtime"}[5m])) > 0)'
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                type: reduce
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0.05
                        type: gt
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Alerting
          for: 10m
          annotations:
            summary: '{{ $labels.app }} drops more than 5% of its frames for 10 minutes'
          isPaused: false
        - uid: lith-apps-writer-failures
          title: 'lith app: writer failures'
          # A command that returned an error or panicked, or whose batch failed
          # (a full disk, a locked database). The app logs each one.
          condition: C
          data:
            - refId: A
              queryType: range
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus-ds
              model:
                expr: 'sum by (app) (increase({__name__=~".+_writer_command_failures_total", job="go_runtime"}[10m]))'
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                type: reduce
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 3
                        type: gt
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Alerting
          for: 0s
          annotations:
            summary: '{{ $labels.app }} has had more than 3 commands fail in 10 minutes'
          isPaused: false
        - uid: lith-apps-budget-refusals
          title: 'lith app: streams refused'
          # Only an app whose budget sets Refuse turns streams away (503); the
          # pages retry. Raise the memory, or lower MinWindow.
          condition: C
          data:
            - refId: A
              queryType: range
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus-ds
              model:
                expr: 'sum by (app) (increase({__name__=~".+_sse_budget_refused_total", job="go_runtime"}[10m]))'
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                type: reduce
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Alerting
          for: 0s
          annotations:
            summary: '{{ $labels.app }} has turned streams away for want of memory in the last 10 minutes'
          isPaused: false
