version: '3'

vars:
  BIN: app

tasks:
  generate:
    desc: Compile the templ views
    cmds:
      - go tool templ generate

  dev:
    desc: Serve on http://127.0.0.1:8080 and rebuild on every change (air)
    cmds:
      - go tool air

  test:
    desc: Vet, check the formatting, run the tests with the race detector
    deps: [generate]
    cmds:
      - go vet ./...
      - test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - go test -race ./...

  build:
    desc: Build the static binary, everything embedded
    deps: [generate]
    vars:
      VERSION:
        sh: git describe --tags --match 'v[0-9]*' --always --dirty 2>/dev/null || echo dev
    env:
      CGO_ENABLED: '0'
    cmds:
      - go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o {{.BIN}} ./cmd/app
