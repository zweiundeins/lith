# go tool task dev: rebuilds and restarts the server on every change to Go,
# templ, CSS, JS and SQL files. Open pages reconnect their streams.
root = "."
tmp_dir = "tmp"

[build]
  pre_cmd = ["go tool templ generate"]
  cmd = "go build -o ./tmp/app ./cmd/app"
  entrypoint = ["./tmp/app", "serve", "-debug"]
  include_ext = ["go", "templ", "css", "js", "sql"]
  exclude_dir = ["tmp", "data", "deploy", "benchmarks"]
  exclude_regex = ["_templ\\.go$", "_test\\.go$"]
  delay = 200
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
