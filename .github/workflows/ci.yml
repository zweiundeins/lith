name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: nested modules
        run: |
          failed=
          for m in backup dbmetrics/prom minify prom; do
            (cd "$m" && go vet ./... && go test -race ./...) || failed="$failed $m"
          done
          if [ -n "$failed" ]; then echo "failed:$failed"; exit 1; fi
      - name: generated project
        # lith-new writes the template into a project that points at this
        # checkout, then tidies it (from the module proxy), vets it, tests
        # it with -race and builds it. It needs no browser.
        run: LITH_NEW_E2E=1 go test -run TestGenerated ./cmd/lith-new/

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: site/go.mod
      - name: templ
        run: |
          go tool templ generate
          git diff --exit-code
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
